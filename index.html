<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion — Red Light, Green Light</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:#fff}
.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:clamp(24px,5vw,42px);margin:0}.pill{padding:8px 12px;border-radius:999px;background:#262626}
.card{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:16px;margin-top:14px}
button,input{font:inherit} button{min-height:46px;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700}
input{min-height:46px;border-radius:12px;border:1px solid #555;background:#101010;color:#fff;padding:8px 12px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.hidden{display:none!important}.muted{color:#aaa}.code{font-size:32px;letter-spacing:8px;font-weight:900}
.light{font-size:28px;font-weight:900;text-align:center;padding:10px;border-radius:14px;background:#252525}.green{background:#174d2a}.red{background:#651d24}
.arena{position:relative;height:260px;overflow:hidden;border-radius:18px;background:linear-gradient(#79b9d6 0 43%,#d6b27b 43%);border:1px solid #555}
.cloud{position:absolute;color:#e9f5fa;font-size:48px;opacity:.8}.c1{left:5%;top:8%}.c2{right:12%;top:14%}
.finish{position:absolute;right:18px;top:43%;bottom:0;width:10px;background:#fff}.finishText{position:absolute;right:30px;top:48%;writing-mode:vertical-rl;font-weight:900}
.track{position:absolute;left:20px;right:45px;bottom:25px;height:130px}
.player{position:absolute;bottom:0;width:76px;text-align:center;transition:left .08s linear}.player img{width:64px;height:84px;object-fit:contain;filter:drop-shadow(0 3px 3px #0008)}.tag{font-size:12px;background:#111c;border-radius:8px;padding:3px 5px;display:inline-block;max-width:76px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dead{opacity:.25;filter:grayscale(1)}.self .tag{outline:2px solid #fff}.controls{text-align:center}.move{width:min(360px,100%);font-size:20px;background:#f7c948;color:#111}.move:active{transform:scale(.98)}
#msg{min-height:24px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.playerCard{padding:10px;border-radius:12px;background:#252525}.alive{color:#9be564}.out{color:#ff7b9c}
@media(max-width:600px){.arena{height:220px}.player{width:62px}.player img{width:52px;height:70px}.code{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🟢 Zion: Red Light, Green Light</h1><div class="muted">Multiplayer browser game</div></div>
    <div class="pill" id="conn">Offline</div>
  </div>

  <section id="setup" class="card">
    <h2>Enter the game</h2>
    <div class="row">
      <label>Your name<input id="name" value="Zion" maxlength="18"></label>
      <label>Room code<input id="room" maxlength="4" placeholder="ABCD" autocapitalize="characters"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="create">Create room</button>
      <button id="join">Join room</button>
    </div>
    <p class="muted">Create a room, then share the 4-letter code with friends. Everyone opens the same hosted URL.</p>
  </section>

  <section id="game" class="hidden">
    <div class="card">
      <div class="row" style="align-items:center">
        <div><div class="muted">Room</div><div class="code" id="code">----</div></div>
        <div class="light green" id="light">GREEN LIGHT</div>
        <div style="text-align:center"><div class="muted">Time</div><strong id="time">—</strong></div>
      </div>
      <div id="msg" aria-live="polite" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <div class="arena">
        <div class="cloud c1">☁</div><div class="cloud c2">☁</div>
        <div class="finish"></div><div class="finishText">FINISH</div>
        <div class="track" id="track"></div>
      </div>
    </div>

    <div class="card controls">
      <button class="move" id="move">HOLD TO RUN →</button>
      <p class="muted">Hold the button during GREEN. Release and freeze when it turns RED.</p>
      <div id="hostControls" class="row hidden"><button id="start">Start game</button><button id="reset">Back to lobby</button></div>
    </div>

    <div class="card"><h3>Players</h3><div id="players" class="players"></div></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
let ws, myId=null, isHost=false, lastRoom=null, holding=false;

function connect(action, payload){
  if(ws && ws.readyState===WebSocket.OPEN) return action(payload);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host);
  $("conn").textContent="Connecting…";
  ws.onopen=()=>{ $("conn").textContent="Connected"; action(payload); };
  ws.onclose=()=>{ $("conn").textContent="Disconnected"; };
  ws.onerror=()=>{ $("conn").textContent="Connection error"; };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==="error"){ $("msg").textContent=m.message; return; }
    if(m.type==="joined"){
      myId=m.id; isHost=m.host; $("code").textContent=m.code;
      $("setup").classList.add("hidden"); $("game").classList.remove("hidden");
      $("hostControls").classList.toggle("hidden",!isHost);
      $("msg").textContent=isHost ? "Share the room code, then press Start game." : "Waiting for the host…";
    }
    if(m.type==="state"){ lastRoom=m.room; render(m.room); }
  };
}
function send(o){ if(ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(o)); }

$("create").onclick=()=>connect(()=>send({type:"create",name:$("name").value||"Zion"}));
$("join").onclick=()=>connect(()=>send({type:"join",code:$("room").value,name:$("name").value||"Player"}));
$("start").onclick=()=>send({type:"start"});
$("reset").onclick=()=>send({type:"reset"});

function setMoving(v){
  if(holding===v) return;
  holding=v; send({type:"move",moving:v});
}
["pointerdown","touchstart"].forEach(ev=>$("move").addEventListener(ev,e=>{e.preventDefault();setMoving(true)},{passive:false}));
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("move").addEventListener(ev,e=>{e.preventDefault();setMoving(false)},{passive:false}));
document.addEventListener("keydown",e=>{ if((e.code==="Space"||e.code==="ArrowRight") && !e.repeat){e.preventDefault();setMoving(true)} });
document.addEventListener("keyup",e=>{ if(e.code==="Space"||e.code==="ArrowRight"){e.preventDefault();setMoving(false)} });

function render(r){
  $("code").textContent=r.code;
  $("time").textContent=r.phase==="playing" ? r.timeLeft+"s" : "—";
  $("light").textContent=r.phase==="playing" ? (r.light==="green"?"GREEN LIGHT":"RED LIGHT") : (r.phase==="finished"?"FINISHED":"LOBBY");
  $("light").className="light "+(r.light==="green"?"green":"red");
  $("hostControls").classList.toggle("hidden",!isHost);
  $("start").classList.toggle("hidden",r.phase!=="lobby");
  $("reset").classList.toggle("hidden",r.phase==="lobby");
  if(r.phase==="lobby") $("msg").textContent=isHost?"Share the code, then press Start game.":"Waiting for the host…";
  if(r.phase==="playing") $("msg").textContent="Move only on GREEN. Freeze on RED.";
  if(r.phase==="finished") $("msg").textContent="🏆 "+(r.winner||"Someone")+" reached the finish!";
  const track=$("track"); track.innerHTML="";
  for(const p of r.players){
    const el=document.createElement("div");
    el.className="player "+(p.alive?"":"dead")+" "+(p.id===myId?"self":"");
    el.style.left=Math.max(0,Math.min(100,p.x))+"%";
    el.innerHTML='<img src="zion.png" alt=""><div class="tag">'+escapeHtml(p.name)+(p.finished?" 🏁":"")+'</div>';
    track.appendChild(el);
  }
  $("players").innerHTML=r.players.map(p=>`<div class="playerCard"><b>${escapeHtml(p.name)}</b><br><span class="${p.alive?'alive':'out'}">${p.alive?(p.finished?"Finished":"In"):"Eliminated"}</span></div>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
